# CI de Kotlin/Android (schematize-kotlin). Copie para .github/workflows/ci.yml.
# Config do detekt: assets/lint/detekt.yml (config/detekt/detekt.yml no projeto).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Wrapper valido (checksum no gradle-wrapper.properties)
        run: ./gradlew --version
      - name: ktlint + detekt + testes + lint Android
        run: ./gradlew ktlintCheck detekt check
